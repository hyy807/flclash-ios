name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.9.2-lx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.3'

jobs:
  macos:
    name: macOS release DMG
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | shasum -a 256 -c -

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build macOS release DMG
        run: |
          dart setup.dart macos --env stable -v
          find dist -maxdepth 1 -type f -print

      - name: Verify stable package metadata
        run: |
          set -euo pipefail
          python3 -c 'import json; assert json.load(open("env.json"))["APP_ENV"] == "stable"'
          for dmg in dist/*.dmg; do
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/flclash-release
            app=$(find /tmp/flclash-release -maxdepth 1 -name '*.app' -print -quit)
            /usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$app/Contents/Info.plist" | grep -qx '0.9.2'
            ! grep -RaiE 'APP_ENV.?=.?pre|pre-release|pretest' "$app" || exit 1
            hdiutil detach /tmp/flclash-release
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-LX-macos
          path: ./dist/*.dmg
          if-no-files-found: error
