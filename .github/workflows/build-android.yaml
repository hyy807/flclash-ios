name: build-android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.9.2-lx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.3'

jobs:
  android:
    name: Android release APKs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install bindgen host libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-18-dev

      - name: Fetch CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Android release APKs
        run: |
          dart setup.dart android --env stable -v
          find dist -maxdepth 1 -type f -print

      - name: Verify stable package metadata
        run: |
          set -euo pipefail
          python3 -c 'import json; assert json.load(open("env.json"))["APP_ENV"] == "stable"'
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$aapt" dump badging "$apk" | grep "package:.*name='com.follow.clash'.*versionName='0.9.2'"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-LX-android
          path: ./dist/*.apk
          if-no-files-found: error
